# Half-time updates: every 15 minutes during match hours, post the score and updated win
# chances of any forecast match that has reached half-time. Uses the same secrets and
# variables as the daily pipeline.
name: Half-time updates

on:
  schedule:
    - cron: "*/15 11-22 * * *"    # backup only: GitHub starts these late or skips them;
                                  # cron-job.org triggers this every 15 minutes (see README)
  workflow_dispatch:
    inputs:
      post:
        description: "Post to Telegram (untick for a dry run)"
        type: boolean
        default: true
      force:
        description: "Run even if no forecast match is today"
        type: boolean
        default: false

permissions:
  contents: write                 # to commit records/posted.csv

concurrency:                      # never at the same time as the daily pipeline
  group: records-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Any forecast match today?
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ "$FORCE" = "true" ] || grep -q ",$today," records/forecasts.csv; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "No forecast match on $today: nothing to do."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.check.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Half-time check
        if: steps.check.outputs.go == 'true'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_EN: ${{ vars.TELEGRAM_CHAT_EN }}
          PYTHONPATH: src
          EVENT: ${{ github.event_name }}
          INPUT_POST: ${{ inputs.post }}
        run: |
          args=()
          if [ "$EVENT" = "schedule" ] || [ "$INPUT_POST" = "true" ]; then args+=(--send); fi
          python -m fa.live "${args[@]}"

      - name: Commit the posting log
        if: always() && steps.check.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A records
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Half-time posts $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && exit 0
              sleep 10
            done
            echo "::error::Could not save the posting log: a half-time card may be posted twice."
            exit 1
          fi
